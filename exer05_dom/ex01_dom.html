<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        window.onload = function() {
            // TODO 1. ID로 제목 선택 및 색상 변경
            let header1=document.getElementById('title');

            header1.style.color = 'blue';

            // TODO 2. h2 선택 및 텍스트 변경
            let header2= document.querySelector('h2');

            header2.innerHTML = 'JavaScript';

            // TODO 3. class로 여러 요소 선택 및 색상 변경
            let menu1 = document.getElementsByClassName('item');
            for(let i=0; i<menu1.length; i++){
                menu1[i].style.color = 'red';
            }

            // TODO 4. name으로 여러 요소 선택 및 배경색 변경
            let name1 = document.getElementsByName('message');
             for(let i=0; i<name1.length; i++){
                name1[i].style.backgroundColor = 'yellow';
            }
            // TODO 5. 모든 p 요소 선택 및 글자 굵게 변경
            let allp = document.querySelectorAll('p');

             for(let i=0; i<allp.length; i++){
                allp[i].style.fontWeight = 'bold';
            }

            
        };
    </script>
</head>
<body>
     <h1 id="title">DOM 선택 실습</h1>
    <h2>기존 제목</h2>

    <p class="item">첫 번째 항목</p>
    <p class="item">두 번째 항목</p>
    <p class="item">세 번째 항목</p>

    <p name="message">안녕하세요!</p>
    <p name="message">JavaScript 실습입니다.</p>
    
</body>
</html>
